<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>M-Pesa STK Push Test</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
    }

    .container {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #16a34a;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Pay with M-Pesa</h2>

    <form id="paymentForm">

      <label for="phone">M-Pesa Phone Number</label>

      <input
        type="tel"
        id="phone"
        placeholder="254712345678"
        required
      >

      <label for="amount">Amount (KES)</label>

      <input
        type="number"
        id="amount"
        placeholder="Enter amount"
        min="1"
        required
      >

      <button type="submit" id="payButton">
        Pay with M-Pesa
      </button>

    </form>

    <div id="message"></div>

  </div>


  <script>

    const form = document.getElementById("paymentForm");
    const message = document.getElementById("message");
    const payButton = document.getElementById("payButton");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const phone = document.getElementById("phone").value;
      const amount = document.getElementById("amount").value;


      payButton.disabled = true;
      payButton.innerText = "Processing...";

      message.innerText = "Sending STK Push...";


      try {

        const response = await fetch("/api/stkpush", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            phone: phone,
            amount: amount
          })

        });


        const data = await response.json();


        if (response.ok) {

          message.innerText =
            "STK Push sent! Check your phone and enter your M-Pesa PIN.";

        } else {

          message.innerText =
            data.message || "Failed to send STK Push.";

        }


      } catch (error) {

        console.error(error);

        message.innerText =
          "Connection error. Backend may not be running.";

      }


      payButton.disabled = false;
      payButton.innerText = "Pay with M-Pesa";

    });

  </script>

</body>
    </html>
